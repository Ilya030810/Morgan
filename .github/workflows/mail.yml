name: mail-sort

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call mail endpoint
        run: |
          curl -fsS -m 70 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://morgan-mesh-bot.vercel.app/api/mail
