name: mail-sort

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call mail endpoint
        run: |
          code=$(curl -sS -m 70 -o out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://morgan-mesh-bot.vercel.app/api/mail)
          echo "HTTP $code"
          cat out.txt
          test "$code" = "200"
